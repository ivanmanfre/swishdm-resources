name: Publish resource hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      # Link-preview cards (2026-11-17): drawn from each report page's own swishdm:card tag into the artifact only.
      # A failure here never blocks the deploy: pages without a card keep working, and a page whose tag can not be drawn
      # gets the generic card.
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 20
      - name: Draw report link-preview cards
        continue-on-error: true
        run: |
          npm ci --prefix tools --no-audit --no-fund
          node tools/cards.mjs site/compare
      - id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: ${{ steps.artifact.outputs.name }}

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
